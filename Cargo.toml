[workspace]
resolver = "3"
members = ["crates/*"]
# Each port in frontends/ and each repro in repros/ is its own workspace, with
# its own Cargo.lock and target/. Libraries that pin exact versions (gpui-pre,
# windows-reactor) never have to agree on one dependency graph, and
# `cargo clean` in one folder frees that library's build without touching the
# others.
exclude = ["frontends", "repros"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
